<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Shaswot Gautam</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0c0c0e; --ink:#f2f1ee; --muted:#9b9aa3; --accent:#ff6a2b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    display: grid; place-items: center; text-align: center;
    font-family: 'Inter', sans-serif; padding: 24px;
  }
  .code {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: clamp(5rem, 22vw, 11rem); line-height: 1; color: var(--accent);
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(1.4rem, 4vw, 2rem); margin: 14px 0 10px; }
  p { color: var(--muted); max-width: 420px; margin: 0 auto 28px; line-height: 1.7; }
  a.btn {
    display: inline-block; background: var(--ink); color: #0c0c0e; font-weight: 600;
    padding: 14px 30px; border-radius: 999px; text-decoration: none;
    transition: background .2s, transform .2s;
  }
  a.btn:hover { background: var(--accent); transform: translateY(-2px); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page shipped elsewhere.</h1>
  <p>The link is broken or the page moved — but the portfolio, the projects and I are all still here.</p>
  <a class="btn" href="/">Back to the portfolio</a>
</main>
</body>
</html>
